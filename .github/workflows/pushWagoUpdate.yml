# GitHub Actions workflow to run the esbuild script on changes to JS source files
name: Push wago update

on:
  push:
    paths:
      - 'scripts/build-pi.js'
      - 'assets/js/**'

jobs:
  update:
    name: update wago version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Bump "pi-helper" version
        id: bump
        run: |
          # Read the current version string under "pi-helper"
          current=$(jq -r '.["pi-helper"]' data/wa_versions.json)
          IFS='.' read -r major minor patch <<< "$current"
          patch=$((patch + 1))
          new="$major.$minor.$patch"

          echo "Bumping pi-helper: $current → $new"
          # Update the JSON in place
          jq --arg v "$new" '.["pi-helper"] = $v' data/wa_versions.json \
            > data/wa_versions.tmp.json
          mv data/wa_versions.tmp.json data/wa_versions.json

          # Expose for downstream steps
          echo "NEW_VERSION=$new" >> $GITHUB_ENV

      - name: Commit bumped version
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add data/wa_versions.json
          git commit -m "ci: bump pi-helper to ${{ env.NEW_VERSION }}"
          git push

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # specify the Node.js version matching your project
          node-version: '21.x'
          cache: 'npm'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Run update-pi script
        env:
          NEW_VERSION: ${{ env.NEW_VERSION }}
        run: |
          node backend_scripts/update-pi.mjs

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git config pull.rebase true   # rebase
          git add assets/bundles/
          git commit -m "Updated Bundles || echo "No changes to commit"
          git pull || echo "No changes to pull"
          git push || echo "No changes to push"
