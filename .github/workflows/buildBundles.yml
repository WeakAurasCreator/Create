# GitHub Actions workflow to run the esbuild script on changes to JS source files
name: Build PI Generator Bundles

on:
  push:
    paths:
      - 'scripts/build-pi.js'
      - 'assets/js/**'
   workflow_run:
    workflows: ["Build pi json", "Gather Static WoW data"]
    types:
      - completed

jobs:
  build:
    name: Run esbuild Bundles
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # specify the Node.js version matching your project
          node-version: '21.x'
          cache: 'npm'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Build frontend bundles
        run: |
          node backend_scripts/build-bundles.js

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git config pull.rebase true   # rebase
          git add assets/bundles/
          git commit -m "Updated Bundles || echo "No changes to commit"
          git pull || echo "No changes to pull"
          git push || echo "No changes to push"
